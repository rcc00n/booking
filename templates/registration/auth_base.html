{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block page_title %}Account{% endblock %} • Malva Booking</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    :root{
      --green:#204029;
      --gold:#AF9525;
      --gold-dark:#9b8521;
      --taupe:#DAD3C1;
      --lgray:#DEDEDE;
      --dgray:#4D4D4D;
      --card-bg:hsla(0 0% 100%/.58);
      --card-border:hsla(0 0% 100%/.35);
      --field-bg:hsla(0 0% 100%/.92);
      --error-bg:#ffe5e5;
      --error-text:#c30000;
    }

    *{box-sizing:border-box;}

    html,body{
      height:100%;
      margin:0;
      font-family:"Poppins",sans-serif;
      color:var(--dgray);
      background:
        radial-gradient(60% 120% at 90% -20%, color-mix(in srgb, var(--green) 26%, transparent) 0%, transparent 60%),
        linear-gradient(160deg, var(--taupe) 0%, var(--lgray) 100%);
      overflow:auto;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 80% 20%, rgba(32,64,41,.30) 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(175,149,37,.30) 0%, transparent 45%);
      filter:blur(90px);
      transform:scale(1.2);
      z-index:0;
    }

    .auth-wrapper{
      position:relative;
      z-index:1;
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }

    .auth-card{
      width:min(460px, 100%);
      background:var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:28px;
      padding:48px 42px 40px;
      backdrop-filter:blur(32px) saturate(160%);
      -webkit-backdrop-filter:blur(32px) saturate(160%);
      box-shadow:0 28px 60px rgba(0,0,0,.15);
    }

    .auth-title{
      margin:0 0 18px;
      font-size:2rem;
      font-weight:700;
      letter-spacing:-.02em;
      color:var(--green);
      text-align:center;
    }

    .auth-lead{
      margin:0 0 24px;
      font-size:1rem;
      line-height:1.6;
      text-align:center;
      color:rgba(77,77,77,.78);
    }

    .auth-form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .auth-field{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .auth-field label{
      font-size:.95rem;
      font-weight:600;
      letter-spacing:.01em;
      color:rgba(32,64,41,.78);
    }

    .auth-input{
      width:100%;
      border:none;
      border-radius:18px;
      background:var(--field-bg);
      padding:18px 20px;
      font-size:1rem;
      font-weight:500;
      line-height:1.4;
      color:var(--dgray);
      box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.06);
      transition:background .25s ease, box-shadow .25s ease;
    }

    .auth-input:focus{
      outline:none;
      background:#fff;
      box-shadow:inset 0 0 0 2px var(--gold);
    }

    .auth-errors{
      margin:0;
      padding:12px 16px;
      border-radius:16px;
      background:var(--error-bg);
      color:var(--error-text);
      font-size:.92rem;
      list-style:none;
    }

    .auth-field__error{
      color:var(--error-text);
      font-size:.85rem;
      line-height:1.4;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      border:none;
      border-radius:999px;
      padding:16px;
      font-size:1rem;
      font-weight:600;
      letter-spacing:.05em;
      color:#fff;
      background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
      cursor:pointer;
      transition:transform .2s, box-shadow .25s, opacity .2s;
      text-decoration:none;
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 28px rgba(0,0,0,.22);
    }

    .btn:active{
      transform:none;
      box-shadow:0 10px 18px rgba(0,0,0,.2);
    }

    .btn--ghost{
      background:#fff;
      color:var(--gold);
      box-shadow:inset 0 0 0 2px var(--gold);
    }

    .auth-footnote{
      margin:18px 0 0;
      font-size:.92rem;
      text-align:center;
      color:rgba(32,64,41,.7);
    }

    .auth-footnote a{
      color:var(--gold);
      font-weight:600;
      text-decoration:none;
      transition:color .2s ease, text-decoration-color .2s ease;
    }

    .auth-footnote a:hover{
      color:var(--gold-dark);
      text-decoration:underline;
      text-decoration-thickness:2px;
      text-underline-offset:3px;
    }

    .auth-hint{
      font-size:.88rem;
      line-height:1.5;
      color:rgba(32,64,41,.7);
      text-align:center;
      margin:0 0 18px;
    }

    .auth-hint--left{
      text-align:left;
      margin-top:-6px;
    }

    .auth-contact{
      margin-top:20px;
      font-size:.9rem;
      color:rgba(32,64,41,.66);
      text-align:center;
    }

    .auth-contact a{
      color:var(--gold);
      font-weight:600;
      text-decoration:none;
    }

    .auth-contact a:hover{
      color:var(--gold-dark);
      text-decoration:underline;
      text-decoration-thickness:2px;
      text-underline-offset:3px;
    }

    @media(max-width:520px){
      .auth-card{
        padding:40px 24px 34px;
        border-radius:24px;
      }

      .auth-title{
        font-size:1.8rem;
      }
    }
  </style>
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card">
      {% block card %}{% endblock %}
    </section>
  </main>
</body>
</html>
