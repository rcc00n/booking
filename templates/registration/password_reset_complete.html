{% extends "registration/auth_base.html" %}
{% block page_title %}Password updated{% endblock %}
{% block card %}
  <h1 class="auth-title">Password updated</h1>
  <p class="auth-lead">
    Your password has been changed successfully. You can now sign in with your new credentials.
  </p>
  <p class="auth-footnote">
    <a href="{% url 'login' %}">Return to sign in</a>
  </p>
{% endblock %}
